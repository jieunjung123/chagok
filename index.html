<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="차곡">
<link id="appicon" rel="apple-touch-icon" href="">
<link id="fav" rel="icon" href="">
<title>차곡</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#f2f2f2;--s:#fff;--ink:#191919;--mid:#707070;--ln:#e0e0e0;--soft:#ebebeb;--hl:rgba(25,25,25,0.065);--r:14px;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--s:#1b1b1b;--ink:#ececec;--mid:#9a9a9a;--ln:#2d2d2d;--soft:#252525;--hl:rgba(255,255,255,0.075)}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.5 'Pretendard Variable',Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#side{position:fixed;inset:0 auto 0 0;width:230px;background:var(--s);border-right:1px solid var(--ln);padding:calc(20px + env(safe-area-inset-top)) 14px 20px;transform:translateX(-100%);transition:transform .22s;z-index:20;overflow-y:auto;display:flex;flex-direction:column}
#side.open{transform:none}
#side h1{font-size:19px;font-weight:800;padding:4px 12px 14px;letter-spacing:-.03em}
.nav{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;color:var(--mid);font-weight:500}
.nav.on{background:var(--ink);color:var(--bg)}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--ln)}
#veil{position:fixed;inset:0;background:#0006;z-index:15;display:none}
#veil.on{display:block}
#top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bg)}
#top b{font-size:17px;letter-spacing:-.02em;flex:1}
#top button.burger{font-size:22px;width:36px;height:36px}
.off-badge{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--soft);color:var(--mid);display:none}
.off-badge.on{display:inline-block}
main{padding:4px 16px calc(40px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
main.wide{max-width:1100px}
.card{background:var(--s);border:1px solid var(--ln);border-radius:var(--r);padding:16px;margin-bottom:12px;transition:transform .15s,opacity .15s}
.card h3{font-size:14px;font-weight:600;color:var(--mid);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.quote{font-size:16.5px;line-height:1.55;letter-spacing:-.02em;font-weight:600}
.hero{text-align:center;padding:20px 16px}
.hero .big{font-size:32px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.25;margin-top:6px}
.hero .dl{font-size:15px;color:var(--mid);font-weight:500}
.hero .sub-left{font-size:12px;color:var(--mid);margin-top:4px}
.in{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg)}
textarea.in{min-height:84px;resize:none;overflow:hidden;line-height:1.55}
.row{display:flex;gap:8px;align-items:center}
.row>.in{flex:1;min-width:0}
.wrap{flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:600;white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm-btn{padding:5px 10px;font-size:12px;border-radius:8px;font-weight:600}
.btn.cute-stamp{padding:5px 9px;font-size:11.5px;border-radius:99px;background:var(--soft);color:var(--ink);border:1px dashed var(--mid);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.btn.full{width:100%;margin-top:10px}
.ic{width:40px;height:40px;border-radius:10px;background:var(--soft);font-size:18px}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ring{text-align:center;padding:6px 0;border-radius:10px}
.ring svg{width:68px;height:68px;transform:rotate(-90deg)}
.ring b{display:block;font-size:13px;margin-top:2px}.ring small{color:var(--mid)}
.item{display:flex;align-items:center;gap:6px;padding:10px 0;border-bottom:1px solid var(--ln)}
.item:last-child{border:0}
.item .t{flex:1;min-width:0;word-break:break-word;white-space:pre-wrap}
.item.done .t{color:var(--mid);text-decoration:line-through}
.item>.chk{margin-right:4px}
.chk{width:24px;height:24px;border:2px solid var(--ink);border-radius:7px;flex:none;display:grid;place-items:center;font-size:14px;line-height:1}
.chk.on{background:var(--ink);color:var(--bg)}
.sm{font-size:12.5px;color:var(--mid)}
.edited-tag{font-size:11px;color:var(--mid);margin-left:4px;font-weight:500}
.x{color:var(--mid);font-size:15px;padding:4px 6px;border-radius:8px}
.drag-h{cursor:grab;color:var(--mid);padding:4px 6px;font-size:15px;user-select:none;touch-action:none}
.drag-h:active{cursor:grabbing}
.dragging{opacity:.45;border:1.5px dashed var(--ink)!important}
.badge{font-size:11.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--mid);color:var(--mid);white-space:nowrap;display:inline-block}
.badge.l2{border-color:var(--ink);color:var(--ink)}
.badge.l3{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg-wrap{display:flex;background:var(--soft);border-radius:10px;padding:3px;margin-bottom:12px;gap:2px}
.seg{flex:1;padding:8px 4px;border-radius:8px;color:var(--mid);font-weight:600;font-size:13.5px}
.seg.on{background:var(--s);color:var(--ink);box-shadow:0 1px 2px #0002}
.navbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:700;font-size:17px;gap:6px}
.navbar .lab{padding:6px 12px;border-radius:10px;background:var(--soft)}
.mgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px}
.mgrid .seg{background:var(--soft)}.mgrid .seg.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;grid-auto-rows:minmax(0,auto)}
.dow{font-style:normal;text-align:center;font-size:13px;font-weight:600;color:var(--mid);padding:4px 0}
.dow:first-child{color:#d0504a}
.cell{min-height:max(88px,calc((100vh - 400px)/6));background:var(--s);border:1px solid var(--ln);border-radius:9px;padding:4px 2.5px;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden;position:relative;width:100%}
.cell-top{display:flex;align-items:center;justify-content:space-between;gap:1px;min-height:18px;width:100%}
.cell .n{font-size:12px;font-weight:700;line-height:1.1}
.cell em{font-style:normal;font-size:12px;line-height:1;flex:none}
/* 4번: 일정 글씨 다섯글자 이상 보이도록 폰트/자간/패딩 최적화 */
.cell small{font-size:9.5px;letter-spacing:-.05em;line-height:1.2;background:var(--soft);border-radius:3px;padding:1px 2px;white-space:nowrap;overflow:hidden;text-overflow:clip;display:block;width:100%}
.cell .w{font-size:9.5px;font-weight:700;border-radius:4px;padding:0 3.5px;align-self:flex-start;border:1px solid var(--ink)}
.cell .w.on{background:var(--ink);color:var(--bg)}
.cell .w.half{background:var(--soft);color:var(--ink);border-style:dashed}
.cell .w.off{color:var(--ink)}
.cell.today .n{background:var(--ink);color:var(--bg);border-radius:99px;padding:1px 5px}
.cell.sel{border-color:var(--ink);border-width:2px}
.stars button{font-size:26px;color:var(--ln);padding:0 2px}.stars button.on{color:var(--ink)}
.week .card{padding:12px}
/* 9번: 리뷰 사진 잘리지 않고 전체 보이게 */
.photo{width:100%;max-height:420px;object-fit:contain;background:var(--bg);border-radius:10px;margin-top:8px;display:block}
.emo{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.emo button{font-size:22px;width:38px;height:38px;border-radius:10px;background:var(--soft)}
/* 5번: 루틴 오늘 날짜 열 형광펜 하이라이트 (모노톤 톤앤매너 유지) */
.ht{overflow-x:auto;margin:0 -4px}
.ht table{border-collapse:collapse;min-width:100%}
.ht th,.ht td{padding:4px 2px;text-align:center;font-size:11px;color:var(--mid);font-weight:500}
.ht td .chk{width:22px;height:22px;border-width:1.5px;border-radius:6px;margin:auto;font-size:12px}
.ht th:first-child,.ht td:first-child{position:sticky;left:0;background:var(--s);text-align:left;min-width:108px;max-width:108px;z-index:1;padding-right:6px}
.ht td:first-child{color:var(--ink);font-weight:600;font-size:13px}
.ht th.td-today{color:var(--ink);background:var(--hl);border-top:2px solid var(--ink);border-left:1px solid var(--ln);border-right:1px solid var(--ln);font-weight:800;border-radius:8px 8px 0 0}
.ht th.td-today .today-pill{display:inline-block;font-size:9px;background:var(--ink);color:var(--bg);padding:0 4px;border-radius:4px;margin-bottom:1px}
.ht td.td-today-cell{background:var(--hl);border-left:1px solid var(--ln);border-right:1px solid var(--ln)}
.ht tr:last-child td.td-today-cell{border-bottom:2px solid var(--ink);border-radius:0 0 8px 8px}
.slot{font-size:10px;color:var(--mid);display:block;font-weight:500}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.stp{position:relative;text-align:center;font-size:11px;color:var(--mid);line-height:1.35;padding:6px 4px;border-radius:10px;background:var(--bg)}
.stp svg{width:80px;height:80px;color:var(--ink);transform:rotate(-8deg)}
.stp:nth-child(even) svg{transform:rotate(7deg)}
.stp b{display:block;color:var(--ink);font-size:12px}
.stp .stp-del{position:absolute;top:2px;right:4px;font-size:13px;color:var(--mid);padding:2px 5px;border-radius:6px}
/* 11번: 디데이 2줄 가독성 레이아웃 */
.dd-card{padding:14px 0;border-bottom:1px solid var(--ln);display:flex;flex-direction:column;gap:6px}
.dd-card:last-child{border:0}
.dd-line1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.dd-title{font-size:16px;font-weight:700;word-break:break-word}
.dd-num{font-size:24px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.dd-num.paused{color:var(--mid)}
.dd-line2{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dd-actions{display:flex;align-items:center;gap:4px}
.yr{font-size:15px;font-weight:700;margin:14px 0 2px}
.sel2{padding:11px 8px;border:1px solid var(--ln);border-radius:10px;background:var(--bg)}
.wlist-row{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;background:var(--soft);margin-bottom:6px}
.wlist-row.on{border:1.5px solid var(--ink);background:var(--s)}
.alert-banner{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:12px 16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
#tm{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:none;align-items:center;gap:10px;z-index:30}
#tm.on{display:flex}#tm b{font-size:22px;font-variant-numeric:tabular-nums}#tm span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tm button{color:var(--bg);border:1px solid var(--bg);border-radius:8px;padding:6px 10px}
#gate{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;padding:calc(30px + env(safe-area-inset-top)) 20px;overflow:auto}
#gate.on{display:block}#gate .card{max-width:520px;margin:12px auto}
#md,#wmd,#smd{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:60;padding:12px}
#md.on,#wmd.on,#smd.on{display:flex}
#md .card,#wmd .card,#smd .card{width:100%;max-width:520px;margin:0;max-height:85vh;overflow-y:auto}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:70}
#toast.on{opacity:1}
.empty{color:var(--mid);text-align:center;padding:18px 0;font-size:13.5px}
@media(min-width:900px){#side{transform:none}#top button.burger{display:none}body{padding-left:230px}#veil{display:none!important}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<aside id="side">
  <h1>차곡</h1>
  <div id="nav"></div>
  <div class="side-foot">
    <button class="nav" data-a="appicon" style="font-size:12.5px">📱 앱 아이콘 사진 설정</button>
    <input id="iconf" type="file" accept="image/*" hidden>
  </div>
</aside>
<div id="veil"></div>
<header id="top">
  <button class="burger" id="burger" aria-label="메뉴">☰</button>
  <b id="ttl"></b>
  <span id="offb" class="off-badge">오프라인 모드</span>
</header>
<main id="main"></main>
<div id="tm"><span id="tmn"></span><b id="tmt"></b><button data-a="tmdone">완료</button><button data-a="tmquit">포기</button></div>
<div id="gate"></div>

<!-- 수정 모달 (체크리스트 분류 수정 칸 포함) -->
<div id="md"><div class="card"><h3 id="mh">수정</h3><input class="in" id="mcat" placeholder="분류 (예: 수영 준비물)" style="margin-bottom:8px;display:none"><textarea class="in" id="mv"></textarea><input class="in" type="date" id="mdt" style="margin-top:8px"><input class="in" type="number" id="myr" style="margin-top:8px" placeholder="년도"><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn ghost" data-a="mclose">취소</button><button class="btn" data-a="msave">저장</button></div></div></div>

<!-- 홈 위젯 설정 및 드래그 순서 변경 모달 -->
<div id="wmd"><div class="card"><h3><span>홈 위젯 선택 · 순서 변경</span><button class="x" data-a="wclose">✕</button></h3><p class="sm" style="margin-bottom:10px">체크하여 홈에 표시하고, 오른쪽 ☰ 버튼을 끌어서 순서를 바꾸세요.</p><div id="wlist"></div><div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-a="wclose">완료</button></div></div></div>

<!-- 참 잘했어요 도장판 모달 -->
<div id="smd"><div class="card"><h3><span id="stitle">참 잘했어요 도장</span><button class="x" data-a="sclose">✕</button></h3><div id="sbody"></div></div></div>

<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const rpc=(f,...a)=>new Promise((ok,no)=>{
  if(typeof google==='undefined'||!google.script)return no('no_gas');
  google.script.run.withSuccessHandler(ok).withFailureHandler(no)[f](...a);
});
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const T=ymd(new Date());
const W='일월화수목금토';
const dd=s=>new Date((s||T)+'T00:00');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 15, 16, 17번: 카피워크/퀘스트 탭 제거, 리뷰 탭을 노트 탭 바로 아래로 배치 */
const MENU=[
  ['home','홈'],
  ['note','노트'],
  ['diary','리뷰'],
  ['cal','캘린더'],
  ['dday','디데이'],
  ['habit','루틴 (정기)'],
  ['todo','투두 (비정기)'],
  ['checklist','체크리스트'],
  ['shop','쇼핑리스트'],
  ['bucket','버킷리스트'],
  ['trash','🗑️']
];
const TL={'할일':'투두','습관':'루틴','일정':'일정','인박스':'노트','미션':'퀘스트','쇼핑':'쇼핑','버킷':'버킷','디데이':'디데이','일기':'리뷰','근무표':'근무표','체크리스트':'체크리스트','설정':'설정'};

const WIDGET_META=[
  ['quote','📖 오늘의 책 명언'],
  ['quest','🎲 오늘의 퀘스트'],
  ['rings','⭕ 오늘 달성률'],
  ['note','📝 노트에 바로 적기'],
  ['todo','✅ 오늘 투두'],
  ['habit','🔁 오늘 루틴'],
  ['checklist','🎒 체크리스트'],
  ['cal','📅 오늘 일정'],
  ['dday','⏳ 디데이'],
  ['shop','🛒 쇼핑리스트'],
  ['bucket','🌟 버킷리스트'],
  ['diary','✍️ 최근 리뷰']
];
const DEFAULT_WIDGETS=['quote','quest','rings','checklist','todo','note'];

const QS=[
  '오늘 할 수 있는 일을 내일로 미루지 마라 — 벤저민 프랭클린',
  '우리는 반복적으로 하는 행동 그 자체다 — 윌 듀런트',
  '작은 습관의 힘은 복리로 돌아온다 — 제임스 클리어, 아주 작은 습관의 힘',
  '시작이 반이다. 일단 시작하면 끝낼 힘이 생긴다 — 아리스토텔레스',
  '어제와 똑같이 살면서 다른 미래를 기대하는 것은 어리석다 — 아인슈타인',
  '천 리 길도 한 걸음부터 시작된다 — 노자, 도덕경',
  '고통이 남기고 간 뒤를 보라. 고난이 지나면 반드시 기쁨이 스며든다 — 괴테'
];

/* 14번: ISTP도 흥미로워할 관찰형·효율형·미니멀 기발한 퀘스트 30선 */
const MISSIONS=[
  '자주 쓰는 앱 하나 단축키나 숨은 제스처 1개 찾아 써보기',
  '방 안에서 1년 넘게 안 쓴 물건 딱 1개 찾아내서 버리기',
  '오늘 마시는 음료 성분표 끝까지 정독해보기',
  '스마트폰 사진첩에서 제일 오래된 스크린샷 5장 지우기',
  '오늘 가는 길에 간판 글씨체가 제일 특이한 가게 하나 찍어두기',
  '키보드나 리모컨 등 손 자주 닿는 물건 하나만 완벽하게 닦기',
  '평소 2배속으로 보던 영상 딱 하나만 정배속으로 끝까지 보기',

function updateNetBadge(){
  const b=$('#offb');
  const q=loadLocal(LS_Q,[]);
  if(!navigator.onLine){b.textContent='오프라인 모드';b.classList.add('on')}
  else if(q.length){b.textContent='동기화 대기 '+q.length;b.classList.add('on')}
  else b.classList.remove('on');
}

function enqueueSync(act,payload){
  const q=loadLocal(LS_Q,[]);
  q.push({act,payload});
  saveLocal(LS_Q,q);
  updateNetBadge();
}

async function flushQueue(){
  if(!navigator.onLine)return updateNetBadge();
  let q=loadLocal(LS_Q,[]);
  if(!q.length)return updateNetBadge();
  const remain=[];
  for(const item of q){
    try{
      if(item.act==='upsert')await rpc('upsert',item.payload);
      else if(item.act==='remove')await rpc('remove',item.payload);
      else if(item.act==='removeMany')await rpc('removeMany',item.payload);
    }catch(e){remain.push(item)}
  }
  saveLocal(LS_Q,remain);
  updateNetBadge();
}
window.addEventListener('online',()=>{toast('인터넷 연결됨 – 자동 동기화합니다');flushQueue()});
window.addEventListener('offline',()=>updateNetBadge());

function save(o){
  const n=new Date(),ts=ymd(n)+' '+pad(n.getHours())+':'+pad(n.getMinutes());
  let r=o.ID&&S.rows.find(x=>x.ID===o.ID);
  if(!r){r={ID:T.replace(/-/g,'')+'-'+Math.random().toString(36).slice(2,7),'상태':'대기','날짜':T,'생성일시':ts};S.rows.push(r)}
  Object.assign(r,o,{'수정일시':ts});
  saveLocal(LS_ROWS,S.rows);
  if(navigator.onLine){
    rpc('upsert',r).catch(()=>enqueueSync('upsert',r));
  }else{
    enqueueSync('upsert',r);
  }
  return r;
}

function calcDday(r){
  const baseDate=r['종료시간']||T; // 종료시간에 멈춘 날짜가 있으면 그 날짜 기준으로 고정
  const x=Math.round((dd(r['날짜'])-dd(baseDate))/864e5);
  const s=r['반복규칙']==='since';
  const num=s?(x<=0?(-x+1)+'일째':'D'+(-x)):(x>0?'D-'+x:x===0?'D-DAY':'D+'+(-x));
  return {x,s,num,paused:!!r['종료시간'],alarm:r['스티커']==='🔔'};
}

function checkDdayNotifications(){
  if(loadLocal(LS_DD_ALERT,'')===T)return;
  const alerts=[];
  R('디데이').forEach(r=>{
    const info=calcDday(r);
    if(!info.alarm||info.paused)return;
    if(!info.s && [0,1,3,7].includes(info.x)){
      alerts.push(`🔔 [${r['제목']}] ${info.x===0?'오늘이 D-DAY입니다!':'D-'+info.x+' 남았습니다.'}`);
    }else if(info.s && info.x<=0){
      const days=-info.x+1;
      if(days===1 || days%100===0 || days===365)alerts.push(`🎉 [${r['제목']}] 오늘로 ${days}일째입니다!`);
    }
  });
  if(alerts.length){
    S.ddAlerts=alerts;
    saveLocal(LS_DD_ALERT,T);
    if('Notification' in window && Notification.permission==='granted'){
      alerts.forEach(msg=>new Notification('차곡 디데이 알림',{body:msg}));
    }
  }
}

  const pk=S.pk?`<div class="card"><div class="navbar"><button class="ic" data-a="yr" data-v="-1">‹</button><span>${y}년</span><button class="ic" data-a="yr" data-v="1">›</button></div><div class="mgrid">${[...Array(12)].map((_,i)=>`<button class="seg ${i===d.getMonth()?'on':''}" data-a="mon" data-v="${i}">${i+1}월</button>`).join('')}</div><div class="row"><input class="in" type="date" id="jd" value="${S.day}"><button class="btn" data-a="jump">이동</button><button class="btn ghost" data-a="gotoday">오늘</button></div></div>`:'';
  return `<div class="seg-wrap">${tabs}</div>${nav}${pk}`+V['c_'+S.cal]()};

/* 4번: 반차근무 버튼 및 일정 5글자 이상 표시 */
V.c_month=()=>{
  const d=dd(S.day),y=d.getFullYear(),m=d.getMonth(),f=new Date(y,m,1).getDay(),len=new Date(y,m+1,0).getDate(),wk={};
  R('근무표').forEach(r=>wk[r['날짜']]=r['제목']);
  const modes=[['','보기'],['근무','근무'],['반차','반차'],['휴무','휴무'],['지움','지우기']].map(([k,l])=>`<button class="seg ${S.paint===k?'on':''}" data-a="paint" data-v="${k}">${l}</button>`).join('');
  let c='';[...W].forEach(x=>c+=`<i class="dow">${x}</i>`);
  for(let i=0;i<f;i++)c+='<b></b>';
  for(let n=1;n<=len;n++){
    const ds=y+'-'+pad(m+1)+'-'+pad(n),e=ev(ds),st=e.find(x=>x['스티커']),w=wk[ds];
    const wCls=w==='근무'?'on':w==='반차'?'half':'off';
    c+=`<button class="cell ${ds===T?'today':''} ${ds===S.day?'sel':''}" data-a="pick" data-v="${ds}"><div class="cell-top"><span class="n">${n}</span><em>${st?esc(st['스티커']):''}</em></div>${w?`<span class="w ${wCls}">${w}</span>`:''}${e.slice(0,3).map(x=>`<small>${esc(x['제목']!=='스티커'?x['제목']:'')||'&nbsp;'}</small>`).join('')}${e.length>3?`<small>+${e.length-3}</small>`:''}</button>`;
  }
  return `<div class="grid">${c}</div><div class="seg-wrap" style="margin-top:12px">${modes}</div><p class="sm" style="text-align:center">${S.paint?'날짜를 눌러 '+(S.paint==='지움'?'근무 표시를 지워요':S.paint+'(으)로 표시해요'):'날짜를 누르면 일간 화면에서 일정을 추가할 수 있어요'}</p>`};

V.c_week=()=>{
  const d=dd(S.day);d.setDate(d.getDate()-d.getDay());let h='';
  const wk={};R('근무표').forEach(r=>wk[r['날짜']]=r['제목']);
  for(let i=0;i<7;i++){const ds=ymd(d),e=ev(ds);
    h+=`<button class="card" style="width:100%;text-align:left" data-a="pick" data-v="${ds}"><b>${md(ds)}</b> ${ds===T?'<span class="badge l3">오늘</span>':''} ${wk[ds]?`<span class="badge ${wk[ds]==='근무'?'l2':''}">${wk[ds]}</span>`:''}<div class="sm">${e.length?e.map(x=>(x['시작시간']?esc(x['시작시간'])+' ':'')+esc(x['스티커'])+' '+esc(x['제목']!=='스티커'?x['제목']:'')).join('<br>'):'일정 없음'}</div></button>`;d.setDate(d.getDate()+1)}
  return `<div class="week">${h}</div>`};

V.c_day=()=>{
  const e=ev(S.day),w=(R('근무표').find(r=>r['날짜']===S.day)||{})['제목']||'';
  return `<div class="card"><h3>근무 설정</h3><div class="seg-wrap" style="margin:0">${['근무','반차','휴무',''].map(k=>`<button class="seg ${w===k?'on':''}" data-a="setwork" data-v="${k}">${k||'해제'}</button>`).join('')}</div></div>
  <div class="card">${e.length?e.map(x=>`<div class="item"><span style="font-size:20px">${esc(x['스티커'])}</span><div class="t">${esc(x['제목']!=='스티커'?x['제목']:'')}<div class="sm">${esc(x['시작시간'])}${x['종료시간']?' – '+esc(x['종료시간']):''}</div></div>${pen(x.ID)}${rm(x.ID)}</div>`).join(''):none('이 날의 일정이 없어요')}</div>
  <div class="card"><h3>일정 추가</h3><input class="in" id="et" placeholder="일정 제목"><div class="row" style="margin-top:8px"><input class="in" id="es" type="time"><input class="in" id="ee" type="time"><input class="in" id="ek" placeholder="😀" maxlength="4" style="max-width:70px;text-align:center;font-size:20px"></div><div class="emo">${EMO.map(x=>`<button data-a="emo" data-v="${x}">${x}</button>`).join('')}</div><p class="sm" style="margin-top:6px">스티커 칸에 키보드의 이모지를 직접 입력해도 돼요</p><button class="btn full" data-a="addev">일정 저장</button></div>`};

/* 11번 & 12번: 디데이 2줄 레이아웃 + 날짜 계산 멈춤 버튼 + 알림 설정 버튼 */
V.dday=()=>{
  const l=R('디데이').sort((a,b)=>String(a['날짜']).localeCompare(String(b['날짜'])));
  return `<div class="card">
    <input class="in" id="ddt" placeholder="디데이 이름 (예: 프로젝트 마감, 입사, 100일)">
    <div class="row wrap" style="margin-top:8px">
      <input class="in" type="date" id="ddd" value="${T}">
      <select class="sel2" id="ddm"><option value="since">시작일부터 (1일째)</option><option value="until">남은 날 (D-day)</option></select>
      <label class="btn ghost" style="display:flex;align-items:center;gap:4px;cursor:pointer"><input type="checkbox" id="dda" checked> 🔔 알림</label>
    </div>
    <button class="btn full" data-a="adddd">디데이 추가</button>
  </div>
  <div class="card">${l.length?l.map(r=>{
    const info=calcDday(r);
    return `<div class="dd-card">
      <div class="dd-line1">
        <div class="dd-title">${esc(r['제목'])} ${info.paused?'<span class="badge">⏸ 멈춤</span>':''}</div>
        <div class="dd-num ${info.paused?'paused':''}">${info.num}</div>
      </div>
      <div class="dd-line2">
        <div class="sm">${r['날짜']} (${W[dd(r['날짜']).getDay()]}) · ${info.s?'시작일=1일':'목표일'}${info.paused?' · 기준:'+r['종료시간']:''}</div>
        <div class="dd-actions">
          <button class="btn ghost sm-btn" data-a="ddpause" data-v="${r.ID}" title="날짜 계산 멈춤/재개">${info.paused?'▶ 재개':'⏸ 멈춤'}</button>
          <button class="btn ghost sm-btn" data-a="ddalarm" data-v="${r.ID}" title="디데이 알림 켜기/끄기">${info.alarm?'🔔 켜짐':'🔕 끔'}</button>
          ${pen(r.ID)}${rm(r.ID)}
        </div>
      </div>
    </div>`;
  }).join(''):none('기념일이나 목표일을 추가해 보세요')}</div>`;
};

/* 3번 & 5번: 루틴 오늘 날짜 형광펜 하이라이트 + 드래그 순서 변경 */
V.habit=()=>{
  const b=dd(S.hm),y=b.getFullYear(),m=b.getMonth(),len=new Date(y,m+1,0).getDate();
  const hb=sortHabits(R('습관')),ck=new Set(R('습관체크').map(c=>c['제목']+'|'+c['날짜']));
  const days=[...Array(len)].map((_,i)=>i+1);
  const head=`<tr><th>루틴</th>${days.map(n=>{const ds=y+'-'+pad(m+1)+'-'+pad(n),isTd=ds===T;return `<th class="${isTd?'td-today':''}">${isTd?'<span class="today-pill">오늘</span><br>':''}${n}<br>${W[new Date(y,m,n).getDay()]}</th>`}).join('')}<th>합계</th></tr>`;
  const body=hb.map(h=>{let s=0;const tds=days.map(n=>{const ds=y+'-'+pad(m+1)+'-'+pad(n),on=ck.has(h['제목']+'|'+ds);if(on)s++;return `<td class="${ds===T?'td-today-cell':''}"><button type="button" class="chk ${on?'on':''}" data-a="hchk" data-v="${h.ID}|${ds}" aria-label="${n}일">${on?'✓':''}</button></td>`}).join('');
    return `<tr><td>${esc(h['제목'])}<span class="slot">${esc(h['시작시간']||'하루종일')}</span></td>${tds}<td>${s}/${len}</td></tr>`}).join('');
  return `<div class="card"><input class="in" id="hn" placeholder="새 루틴 (예: 물 2L 마시기)" data-enter="addhabit"><div class="row" style="margin-top:8px"><select class="sel2" id="hs" style="flex:1">${SLOTS.map(s=>`<option>${s}</option>`).join('')}</select><button class="btn" data-a="addhabit">추가</button></div></div>
  <div class="navbar"><button class="ic" data-a="hshift" data-v="-1">‹</button><span>${y}년 ${m+1}월</span><button class="ic" data-a="hshift" data-v="1">›</button></div>
  <div class="card">${hb.length?`<div class="ht" id="htscroll"><table>${head}${body}</table></div>`:none('매일 반복할 루틴을 추가해 보세요')}</div>
  ${hb.length?`<div class="card"><h3><span>루틴 관리 · 드래그하여 순서 변경</span></h3><div id="habit-sort-list">${hb.map(h=>`<div class="item" data-drag-type="habit" data-id="${h.ID}"><span class="drag-h" title="끌어서 순서 변경">☰</span><div class="t">${esc(h['제목'])} <span class="badge">${esc(h['시작시간']||'하루종일')}</span></div>${pen(h.ID)}${rm(h.ID)}</div>`).join('')}</div></div>`:''}`;
};

V.todo=()=>{
  const all=R('할일'),p=all.filter(r=>r['상태']!=='완료').sort((a,b)=>String(a['날짜']).localeCompare(String(b['날짜']))),d=all.filter(r=>r['상태']==='완료').sort(desc('수정일시')).slice(0,15);
  const it=r=>{const n=+r['이월횟수']||0,dn=r['상태']==='완료',m=+r['타이머(분)']||0;
    return `<div class="item ${dn?'done':''}">${chk(r)}<div class="t">${esc(r['제목'])}<div class="sm">${md(r['날짜'])}${m?' · ⏱ '+dur(m):''}</div></div>${n&&!dn?`<span class="badge ${n>=3?'l3':n>=2?'l2':''}">🔥 ${n}일째</span>`:''}${!dn?`<button class="x" data-a="tstart" data-v="${r.ID}" aria-label="타이머">⏱</button>`:''}${pen(r.ID)}${rm(r.ID)}</div>`};
  return `<div class="card"><input class="in" id="tt" placeholder="할 일" data-enter="addtodo"><div class="row wrap" style="margin-top:8px"><input class="in" id="td" type="date" value="${T}" style="min-width:150px"><input class="in" id="th" type="number" min="0" placeholder="시간" style="max-width:76px"><input class="in" id="tn" type="number" min="0" max="59" placeholder="분" style="max-width:76px"></div><p class="sm" style="margin-top:6px">타이머 시간은 비워 두면 나중에 정할 수 있어요</p><button class="btn full" data-a="addtodo">추가</button></div>
  <div class="card">${p.length?p.map(it).join(''):none('할 일이 없어요. 노트에서 가져오거나 새로 추가하세요')}</div>
  ${d.length?`<div class="card"><h3>완료한 일</h3>${d.map(it).join('')}</div>`:''}
  <p class="sm" style="text-align:center">끝내지 못한 할일은 다음 날로 넘어가고, 3일 연속 미루면 처리 방법을 골라야 해요.</p>`};

/* 8번: 체크리스트 항목 및 분류 이름 수정 설정 */
V.checklist=()=>{
  const all=R('체크리스트');
  const cats=['전체',...new Set(all.map(r=>r['반복규칙']||'기본'))];
  if(!cats.includes(S.chkCat))S.chkCat='전체';
  const list=S.chkCat==='전체'?all:all.filter(r=>(r['반복규칙']||'기본')===S.chkCat);
  const groups=[...new Set(list.map(r=>r['반복규칙']||'기본'))];
  return `<div class="card">
    <h3><span>준비물·체크리스트 추가</span><span class="sm">매일 자정 체크 자동 리셋</span></h3>
    <div class="row wrap">
      <input class="in" id="ckc" placeholder="분류 (예: 수영 준비물, 출근 준비물)" value="${S.chkCat==='전체'?'':esc(S.chkCat)}" style="max-width:210px">
      <input class="in" id="ckt" placeholder="챙겨야 할 물품·항목" data-enter="addchk">
      <button class="btn" data-a="addchk">추가</button>
    </div>
  </div>
  ${cats.length>1?`<div class="seg-wrap" style="overflow-x:auto">${cats.map(c=>`<button class="seg ${S.chkCat===c?'on':''}" data-a="chkcat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:''}
  ${groups.length?groups.map(g=>{
    const items=list.filter(r=>(r['반복규칙']||'기본')===g);
    const doneCnt=items.filter(isChkToday).length;
    return `<div class="card">
      <h3><span>🎒 ${esc(g)} (${doneCnt}/${items.length})</span><button class="btn ghost sm-btn" data-a="rencat" data-v="${esc(g)}">✎ 분류명 수정</button></h3>
      ${items.map(r=>{const on=isChkToday(r);return `<div class="item ${on?'done':''}"><button class="chk ${on?'on':''}" data-a="chktog" data-v="${r.ID}">${on?'✓':''}</button><div class="t">${esc(r['제목'])}</div>${pen(r.ID)}${rm(r.ID)}</div>`}).join('')}
    </div>`;
  }).join(''):`<div class="card">${none('수영 갈 때 준비물, 출근 준비물 등을 등록해 두면 매일 체크만 하고 다음 날 자동으로 리셋돼요')}</div>`}`;
};

V.note=()=>{
  const l=R('인박스').filter(r=>r['상태']==='대기').reverse();
  return `<div class="card"><textarea class="in" id="qi" placeholder="일단 적어 두세요. 정리는 나중에."></textarea><div class="row" style="margin-top:8px;justify-content:flex-end"><button class="btn" data-a="qsave">저장</button></div></div>
  <div class="card">${l.length?l.map(r=>`<div class="item" style="flex-wrap:wrap"><div class="t">${esc(r['제목'])}<div class="sm">${esc(r['생성일시'])}</div></div>${pen(r.ID)}${rm(r.ID)}<div class="row" style="width:100%"><button class="btn ghost" data-a="done" data-v="${r.ID}">처리됨</button></div></div>`).join(''):none('노트가 비었어요')}</div>`};

V.shop=()=>{
  const o={상:0,중:1,하:2},l=R('쇼핑').sort((a,b)=>(a['상태']==='완료')-(b['상태']==='완료')||o[a['반복규칙']]-o[b['반복규칙']]);
  return `<div class="card"><input class="in" id="sh" placeholder="사야 할 것" data-enter="addshop"><div class="row" style="margin-top:8px"><div class="seg-wrap" style="margin:0;flex:1">${['상','중','하'].map(k=>`<button class="seg ${S.urg===k?'on':''}" data-a="urg" data-v="${k}">긴급 ${k}</button>`).join('')}</div><button class="btn" data-a="addshop">추가</button></div></div>
  <div class="card">${l.length?l.map(r=>{const u=r['반복규칙'],dt=String(r['생성일시']||r['날짜']||'').slice(0,10);return `<div class="item ${r['상태']==='완료'?'done':''}">${chk(r)}<div class="t">${esc(r['제목'])}<div class="sm">작성일: ${esc(dt)}</div></div><span class="badge ${u==='상'?'l3':u==='중'?'l2':''}">${u}</span>${pen(r.ID)}${rm(r.ID)}</div>`}).join(''):none('살 것을 적어 보세요')}</div>`};

V.bucket=()=>{
  const l=R('버킷'),ys=[...new Set(l.map(r=>String(r['날짜']).slice(0,4)))].sort().reverse();
  return `<div class="card"><div class="row"><input class="in" type="number" id="by" value="${S.by}" style="max-width:96px"><input class="in" id="bt" placeholder="이루고 싶은 것" data-enter="addbucket"><button class="btn" data-a="addbucket">추가</button></div></div>
  ${ys.length?ys.map(y=>{const g=l.filter(r=>String(r['날짜']).slice(0,4)===y),n=g.filter(r=>r['상태']==='완료').length;return `<div class="card"><div class="yr" style="margin-top:0">${y}년 <span class="sm">${n}/${g.length}</span></div>${g.map(r=>`<div class="item ${r['상태']==='완료'?'done':''}">${chk(r)}<div class="t">${esc(r['제목'])}</div>${pen(r.ID)}${rm(r.ID)}</div>`).join('')}</div>`}).join(''):`<div class="card">${none('올해의 버킷리스트를 적어 보세요')}</div>`}`};

/* 7번 & 9번: 리뷰 수정 시 (수정됨) 표시 + 사진 전체 비율 표시 */
V.diary=()=>{
  const l=R('일기').sort(desc('생성일시'));
  return `<div class="card"><input class="in" id="dt" placeholder="오늘의 리뷰 한 줄" maxlength="200"><div class="stars" id="st" style="margin:8px 0">${[1,2,3,4,5].map(i=>`<button data-a="star" data-v="${i}" aria-label="별 ${i}개">★</button>`).join('')}</div><div class="row"><label class="btn ghost" for="ph">사진</label><input id="ph" type="file" accept="image/*" hidden><span class="sm" id="phn" style="flex:1"></span><button class="btn" data-a="adddiary">저장</button></div></div>
  <div class="card">${l.length?l.map(r=>{
    const edited=(r['태그']==='수정됨')||(r['수정일시']&&r['생성일시']&&r['수정일시']!==r['생성일시']);
    return `<div class="item" style="align-items:flex-start"><div class="t"><span class="sm">${esc(r['생성일시']||r['날짜'])} ${'★'.repeat(+r['별점']||0)}${edited?'<span class="edited-tag">(수정됨)</span>':''}</span><div>${esc(r['상세내용'])}</div>${r['첨부']?`<img class="photo" src="${esc(r['첨부'])}" alt="">`:''}</div>${pen(r.ID)}${rm(r.ID)}</div>`;
  }).join(''):none('첫 리뷰를 남겨 보세요')}</div>`;
};

V.trash=()=>{

let dragState=null;
function initPointerDrag(e){
  const handle=e.target.closest('.drag-h');
  if(!handle)return;
  const item=handle.closest('[data-drag-type]');
  if(!item)return;
  e.preventDefault();
  dragState={type:item.dataset.dragType,el:item,parent:item.parentElement};
  item.classList.add('dragging');
}
function movePointerDrag(e){
  if(!dragState)return;
  const y=e.touches?e.touches[0].clientY:e.clientY;
  const x=e.touches?e.touches[0].clientX:e.clientX;
  const target=document.elementFromPoint(x,y);
  if(!target)return;
  const over=target.closest(`[data-drag-type="${dragState.type}"]`);
  if(over && over!==dragState.el && over.parentElement===dragState.parent){
    const rect=over.getBoundingClientRect();
    const after=(y-rect.top)>(rect.height/2);
    dragState.parent.insertBefore(dragState.el,after?over.nextSibling:over);
  }
}
function endPointerDrag(){
  if(!dragState)return;
  const {type,el,parent}=dragState;
  el.classList.remove('dragging');
  const ids=[...parent.querySelectorAll(`[data-drag-type="${type}"]`)].map(x=>x.dataset.id);
  dragState=null;
  if(type==='habit'){
    ids.forEach((id,idx)=>save({ID:id,'이월횟수':idx}));
    render(true);
  }else if(type==='home-w'){
    const rest=S.wOrder.filter(k=>!ids.includes(k));
    S.wOrder=[...ids,...rest];
    saveWidgetConfig();
    render(true);
  }else if(type==='wmodal'){
    S.wOrder=ids;
    saveWidgetConfig();
    renderWidgetModal();
    render(true);
  }
}
document.addEventListener('mousedown',initPointerDrag);
document.addEventListener('mousemove',movePointerDrag);
document.addEventListener('mouseup',endPointerDrag);
document.addEventListener('touchstart',initPointerDrag,{passive:false});
document.addEventListener('touchmove',movePointerDrag,{passive:false});
document.addEventListener('touchend',endPointerDrag);

  urg:v=>{S.urg=v;render()},
  addshop:()=>{const t=$('#sh').value.trim();if(!t)return;save({'유형':'쇼핑','제목':t,'반복규칙':S.urg});render()},
  addbucket:()=>{const t=$('#bt').value.trim(),y=+$('#by').value||YR;if(!t)return;S.by=y;save({'유형':'버킷','제목':t,'날짜':y+'-01-01'});render()},
  star:v=>{rating=+v;document.querySelectorAll('#st button').forEach((b,i)=>b.classList.toggle('on',i<rating))},
  adddiary:async()=>{const t=$('#dt').value.trim();if(!t)return toast('리뷰를 입력하세요');let url='';
    if(photo){
      if(navigator.onLine){toast('사진 올리는 중…');try{url=await rpc('uploadPhoto',photo,'diary-'+Date.now()+'.jpg')}catch(e){url=photo}}
      else url=photo;
    }
    save({'유형':'일기','제목':'일기','상세내용':t,'별점':rating||'','첨부':url,'상태':'완료'});render()},
  gnow:v=>{S.ok[v]=T;settle();go('todo');startTimer(S.rows.find(x=>x.ID===v))},
  gdel:v=>{trash(v);settle();render()},
  gsplit:v=>{const p=prompt('더 작게 쪼갠 할일을 쉼표로 적어 주세요\n예: 자료 찾기, 초안 쓰기, 검토하기');if(!p)return;p.split(',').map(s=>s.trim()).filter(Boolean).forEach(s=>save({'유형':'할일','제목':s,'이월횟수':0}));trash(v);settle();render()}
};

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.v)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.enter)A[e.target.dataset.enter]()});
document.addEventListener('input',e=>{if(e.target.matches('textarea.in'))grow(e.target)});
$('#burger').onclick=()=>{$('#side').classList.add('open');$('#veil').classList.add('on')};
$('#veil').onclick=closeNav;
setInterval(tick,1000);

checkDdayNotifications();
render(false);
flushQueue().then(()=>{
  rpc('getAll').then(r=>{
    if(r){
      S.rows=r;
      saveLocal(LS_ROWS,r);
      const wcfg=r.find(x=>x['유형']==='설정'&&x['제목']==='widgets');
      if(wcfg&&wcfg['상세내용']){
        try{
          const parsed=JSON.parse(wcfg['상세내용']);
          if(Array.isArray(parsed))S.widgets=parsed;
          else if(parsed.active){S.widgets=parsed.active;if(parsed.order)S.wOrder=parsed.order;}
          WIDGET_META.forEach(([k])=>{if(!S.wOrder.includes(k))S.wOrder.push(k)});
          saveLocal(LS_W,S.widgets);saveLocal(LS_W_ALL,S.wOrder);
        }catch(e){}
      }
      checkDdayNotifications();
      render();
      settle();
    }
  }).catch(()=>updateNetBadge());
});
rpc('quote').then(q=>{if(q){S.q=q;if(S.view==='home')render()}}).catch(()=>{});
</script>
</body>
</html>
