<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="차곡">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f2f2f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <title>차곡</title>
  <link rel="apple-touch-icon" sizes="180x180" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">
  <link rel="icon" type="image/png" href="./icon.png">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f2f2f2; }
    @media (prefers-color-scheme: dark) { html, body { background: #121212; } }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
  </style>
  <script>
    // 안드로이드·크롬 웹앱 설치 시에도 icon.png가 자동 적용되도록 동적 매니페스트 연결
    window.addEventListener('DOMContentLoaded', () => {
      const iconUrl = new URL('./icon.png', location.href).href;
      const manifest = {
        name: '차곡',
        short_name: '차곡',
        start_url: location.href,
        display: 'standalone',
        background_color: '#f2f2f2',
        theme_color: '#f2f2f2',
        icons: [
          { src: iconUrl, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
          { src: iconUrl, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
        ]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = URL.createObjectURL(blob);
      document.head.appendChild(link);
    });
  </script>
</head>
<body>
  <iframe src="여기에_차곡_웹앱_URL_붙여넣기" allow="clipboard-read; clipboard-write"></iframe>
</body>
</html>
